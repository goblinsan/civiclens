<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CivReveal</title>
  <meta name="description" content="See how your representatives actually vote, from official records only.">
  <style>
    :root { color-scheme: light dark; --fg: #1f2328; --muted: #59636e; --bg: #ffffff; --accent: #1d4ed8; }
    @media (prefers-color-scheme: dark) { :root { --fg: #e6edf3; --muted: #9da7b3; --bg: #0d1117; --accent: #79b8ff; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 36rem; padding: 2rem 1rem; text-align: center; }
    h1 { font-size: 2rem; margin: 0 0 .5rem; }
    p { margin: 0 0 1rem; color: var(--muted); }
    a { color: var(--accent); }
  </style>
</head>
<body>
<main>
  <h1>CivReveal</h1>
  <p>See how your representatives actually vote — from official government records, with no party lens.</p>
  <p>The site is being built in the open. Data collection is running; the public interface is on its way.</p>
  <p><a href="https://github.com/goblinsan/civiclens">Source and progress on GitHub</a> · <a href="/bot">About CivRevealBot</a></p>
</main>
</body>
</html>
