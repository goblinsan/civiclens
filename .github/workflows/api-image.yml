name: API image

# Builds the API container on every push to main that touches it, publishes it
# to GitHub's container registry, then deploys it on the home server through
# the self-hosted runner (docker compose pull + up). Pushing to main is the
# deploy.

on:
  push:
    branches: [main]
    paths:
      - apps/api/**
      - packages/**
      - deploy/**
      - pnpm-lock.yaml
      - package.json
      - pnpm-workspace.yaml
      - tsconfig.base.json
      - .github/workflows/api-image.yml
  workflow_dispatch:

concurrency:
  group: api-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: echo "image=ghcr.io/${{ github.repository_owner }}/civreveal-api" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy on home server
    needs: build
    runs-on: [self-hosted, linux, civreveal-home]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Pull and restart the API container
        run: |
          test -f /opt/civreveal/api.env || { echo "::error::/opt/civreveal/api.env is missing on this runner (see docs/home-server-setup.md)"; exit 1; }
          docker compose -f deploy/docker-compose.yml pull --quiet
          docker compose -f deploy/docker-compose.yml up -d --remove-orphans
          docker image prune -f >/dev/null

      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            if wget -qO- http://127.0.0.1:3001/health >/dev/null 2>&1; then
              echo "API healthy"; wget -qO- http://127.0.0.1:3001/health; echo; exit 0
            fi
            sleep 2
          done
          echo "::error::API did not become healthy"; docker compose -f deploy/docker-compose.yml logs --tail=50 api; exit 1
