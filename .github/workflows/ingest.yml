name: Ingest Congress data

# Runs the ingest job (jobs/ingest-congress) against the production database,
# on the self-hosted runner on the home network (docs/home-server-setup.md).
# senate.gov refuses cloud-provider IP ranges, so running from home is a
# precondition for the Senate step; it also needs senate.gov's Akamai bot
# registration for CivRevealBot to be accepted (docs/data-ingestion.md).
#
# Needs repository secrets (Settings → Secrets and variables → Actions):
#   DATABASE_URL       PostgreSQL connection string (include ?sslmode=require for hosted DBs)
#   CONGRESS_API_KEY   from https://api.congress.gov/sign-up/
#   BOT_SIGNING_KEY    optional; Web Bot Auth signing for senate.gov (docs/bot.md)
#
# Migrations are applied before every run, so a brand-new database works.

on:
  workflow_dispatch:
    inputs:
      max_bills:
        description: 'Max bills to fetch (0 = no cap; a full congress is ~15k bills and takes hours)'
        default: '100'
        type: string
      max_votes:
        description: 'Max roll-call votes per chamber (0 = no cap)'
        default: '25'
        type: string
      sync_since:
        description: 'Only bills updated after this ISO-8601 datetime (blank = no filter)'
        default: ''
        type: string
      congress:
        description: 'Congress number'
        default: '119'
        type: string
      steps:
        description: 'Steps to run (comma list of members,bills,senate,house)'
        default: 'members,bills,senate,house'
        type: string
  schedule:
    # Every 6 hours (see docs/data-ingestion.md → refresh cadence). Scheduled
    # runs are incremental: bills updated in the last 7 days, no bill cap.
    - cron: '17 */6 * * *'

concurrency:
  group: ingest-congress
  cancel-in-progress: false

jobs:
  ingest:
    name: Migrate + ingest
    runs-on: [self-hosted, linux, civreveal-home]
    timeout-minutes: 350
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
      # The home runner has a local time zone; hosted runners are UTC. Pin it so
      # timestamps parse the same everywhere.
      TZ: UTC

    steps:
      - name: Normalise and check secrets
        run: |
          # Tolerate values pasted with surrounding quotes or whitespace.
          strip() { v="$1"; v="${v#"${v%%[![:space:]]*}"}"; v="${v%"${v##*[![:space:]]}"}"; v="${v#\"}"; v="${v%\"}"; v="${v#\'}"; v="${v%\'}"; printf '%s' "$v"; }
          DATABASE_URL="$(strip "$DATABASE_URL")"
          CONGRESS_API_KEY="$(strip "$CONGRESS_API_KEY")"
          echo "::add-mask::$DATABASE_URL"
          echo "::add-mask::$CONGRESS_API_KEY"
          echo "DATABASE_URL=$DATABASE_URL"         >> "$GITHUB_ENV"
          echo "CONGRESS_API_KEY=$CONGRESS_API_KEY" >> "$GITHUB_ENV"

          missing=""
          [ -z "$DATABASE_URL" ] && missing="$missing DATABASE_URL"
          [ -z "$CONGRESS_API_KEY" ] && missing="$missing CONGRESS_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — add them under Settings → Secrets and variables → Actions"
            exit 1
          fi
          case "$DATABASE_URL" in
            postgres://*|postgresql://*) ;;
            *) echo "::error::DATABASE_URL must start with postgres:// or postgresql:// (got a value starting with '${DATABASE_URL:0:12}')"; exit 1 ;;
          esac

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Sync policy goals and bill effect codings
        run: pnpm db:sync-goals

      - name: Resolve run parameters
        id: params
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "max_bills=${{ inputs.max_bills }}"   >> "$GITHUB_OUTPUT"
            echo "max_votes=${{ inputs.max_votes }}"   >> "$GITHUB_OUTPUT"
            echo "sync_since=${{ inputs.sync_since }}" >> "$GITHUB_OUTPUT"
            echo "congress=${{ inputs.congress }}"     >> "$GITHUB_OUTPUT"
            echo "steps=${{ inputs.steps }}"           >> "$GITHUB_OUTPUT"
          else
            echo "max_bills=0"                                      >> "$GITHUB_OUTPUT"
            echo "max_votes=100"                                    >> "$GITHUB_OUTPUT"
            echo "sync_since=$(date -u -d '-7 days' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
            echo "congress=119"                                     >> "$GITHUB_OUTPUT"
            echo "steps=members,bills,senate,house"                 >> "$GITHUB_OUTPUT"
          fi

      - name: Run ingest job
        env:
          INGEST_STEPS: ${{ steps.params.outputs.steps }}
          BOT_SIGNING_KEY: ${{ secrets.BOT_SIGNING_KEY }}
          CONGRESS: ${{ steps.params.outputs.congress }}
          MAX_BILLS: ${{ steps.params.outputs.max_bills }}
          MAX_VOTES: ${{ steps.params.outputs.max_votes }}
          SYNC_SINCE: ${{ steps.params.outputs.sync_since }}
          LOG_LEVEL: info
        run: |
          # The job reads SYNC_SINCE only when set; an empty string must be unset.
          [ -z "$SYNC_SINCE" ] && unset SYNC_SINCE
          pnpm --filter @civreveal/ingest-congress dev 2>&1 | tee ingest.log

      - name: Write run summary
        if: always()
        run: |
          {
            echo "## Ingest run — congress ${{ steps.params.outputs.congress }}"
            echo
            echo "| Parameter | Value |"
            echo "|---|---|"
            echo "| MAX_BILLS | ${{ steps.params.outputs.max_bills }} |"
            echo "| MAX_VOTES | ${{ steps.params.outputs.max_votes }} |"
            echo "| SYNC_SINCE | ${{ steps.params.outputs.sync_since || '(none)' }} |"
            echo
            done_line=$(grep -F '"msg":"ingest-congress complete"' ingest.log | tail -1 || true)
            if [ -z "$done_line" ]; then
              echo "**The job did not reach completion.** Check the log above."
              echo
              echo '```'
              grep -E '"level":"(error|fatal)"' ingest.log | tail -20 || true
              echo '```'
            else
              echo "Duration: $(echo "$done_line" | jq -r '.durationMs / 1000 | floor')s"
              echo
              echo "| Entity | Inserted | Updated | Skipped | Failed |"
              echo "|---|---|---|---|---|"
              for k in members bills senateVotes houseVotes; do
                echo "$done_line" | jq -r --arg k "$k" '.[$k] | "| \($k) | \(.inserted) | \(.updated) | \(.skipped) | \(.failed) |"'
              done
              echo
              echo "$done_line" | jq -r '.bills | "Bills unchanged upstream (skipped before fetch): **\(.skipped)** · deferred to a later run by MAX_BILLS: **\(.deferred // 0)**"'
              echo
              echo "### Policy tagging coverage"
              echo
              echo "$done_line" | jq -r '.bills | "- Tagged: **\(.tagged)**\n- Untagged (no tag applies): **\(.untagged)**\n- Unknown policy areas: **\(.unknownPolicyAreas | length)**"'
              unknown=$(echo "$done_line" | jq -r '.bills.unknownPolicyAreas[]?' || true)
              if [ -n "$unknown" ]; then
                echo
                echo "⚠️ Policy area terms outside the known CRS list — review \`jobs/ingest-congress/src/tagging.ts\`:"
                echo
                echo "$unknown" | sed 's/^/- /'
              fi
            fi
            errs=$(grep -E '"level":"(error|fatal)"' ingest.log | jq -r '"- `\(.msg)`\(if .err then ": " + .err else "" end)' 2>/dev/null || true)
            if [ -n "$errs" ]; then
              echo
              echo "### Errors logged"
              echo
              echo "$errs"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
