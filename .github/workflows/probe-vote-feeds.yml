name: Probe vote feeds (temporary)
# Temporary diagnostic — removed once the vote-feed failures are understood.
# Sends only honest User-Agents: the default Node one we send today, and an
# identifying project UA with a contact URL.
on:
  push:
    branches: ['claude/quirky-ritchie-d6inud']

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
    steps:
      - name: Probe URLs
        run: |
          UA_NODE="node"
          UA_PROJECT="CivReveal/0.1 (civic transparency project; +https://github.com/goblinsan/civiclens)"

          probe() { # label url ua
            code=$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 25 -A "$3" -H 'Accept: */*' "$2" || echo ERR)
            ctype=$(file -b --mime-type /tmp/body 2>/dev/null || true)
            printf '%-42s %s  (%s, %s bytes)\n' "$1" "$code" "$ctype" "$(wc -c < /tmp/body)"
            if [ "$code" = "200" ]; then head -c 400 /tmp/body | tr '\n' ' '; echo; echo; fi
          }

          echo "=== SENATE: does an identified client get through? ==="
          probe "senate menu 119_1 UA=node"    "https://www.senate.gov/legislative/LIS/roll_call_lists/vote_menu_119_1.xml" "$UA_NODE"
          probe "senate menu 119_1 UA=project" "https://www.senate.gov/legislative/LIS/roll_call_lists/vote_menu_119_1.xml" "$UA_PROJECT"
          probe "senate menu 119_2 UA=project" "https://www.senate.gov/legislative/LIS/roll_call_lists/vote_menu_119_2.xml" "$UA_PROJECT"
          probe "senate detail 119_2_00001"    "https://www.senate.gov/legislative/LIS/roll_call_votes/vote1192/vote_119_2_00001.xml" "$UA_PROJECT"
          probe "senate robots.txt"            "https://www.senate.gov/robots.txt" "$UA_PROJECT"

          echo "=== HOUSE CLERK: index URL candidates ==="
          for y in 2026 2025; do
            probe "house evs/$y/ROLLCALL.xml"   "https://clerk.house.gov/evs/$y/ROLLCALL.xml" "$UA_PROJECT"
            probe "house evs/$y/index.asp"      "https://clerk.house.gov/evs/$y/index.asp" "$UA_PROJECT"
            probe "house evs/$y/ROLL_000.asp"   "https://clerk.house.gov/evs/$y/ROLL_000.asp" "$UA_PROJECT"
            probe "house evs/$y/roll001.xml"    "https://clerk.house.gov/evs/$y/roll001.xml" "$UA_PROJECT"
          done
          probe "house robots.txt"              "https://clerk.house.gov/robots.txt" "$UA_PROJECT"

          echo "=== CONGRESS.GOV API: vote endpoints (key sent in header) ==="
          api() { # label path
            code=$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 25 -H "X-Api-Key: $CONGRESS_API_KEY" "https://api.congress.gov/v3$2?format=json" || echo ERR)
            printf '%-42s %s  (%s bytes)\n' "$1" "$code" "$(wc -c < /tmp/body)"
            head -c 900 /tmp/body | tr '\n' ' '; echo; echo
          }
          api "house-vote/119/2"                "/house-vote/119/2"
          api "house-vote/119/2/1"              "/house-vote/119/2/1"
          api "house-vote/119/2/1/members"      "/house-vote/119/2/1/members"
          api "house-vote/119/1"                "/house-vote/119/1"
          api "senate-vote/119/2"               "/senate-vote/119/2"
          api "member/C001127 (missing sponsor)" "/member/C001127"
